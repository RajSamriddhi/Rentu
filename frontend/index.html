<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Favicons & App Icons (Optimized for Google Search & Browsers) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#E11D74" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Search SEO Snippet -->
    <title>Rentu⁺ | Don't Buy It. Rent It. Flex It. — Gear Rental</title>
    <meta name="description" content="Rentu⁺ is the peer-to-peer rental network. Rent cameras, gaming consoles, DJ gear, fits, tech, and camping tools directly from verified locals near you." />
    <meta name="keywords" content="gear rental, rent cameras, rent ps5, peer to peer rental, rent equipment, borrow gear, rentu" />
    <link rel="canonical" href="https://www.rentu.site/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:site_name" content="Rentu⁺" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rentu.site/" />
    <meta property="og:title" content="Rentu⁺ | Don't Buy It. Rent It. Flex It." />
    <meta property="og:description" content="Rent cameras, gaming consoles, DJ gear, fits, tech, and camping gear from verified neighbors near you." />
    <meta property="og:image" content="https://www.rentu.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rentu⁺ — Peer-to-Peer Gear Rental Marketplace" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rentu" />
    <meta name="twitter:title" content="Rentu⁺ | Don't Buy It. Rent It. Flex It." />
    <meta name="twitter:description" content="Rent cameras, gaming consoles, DJ gear, fits, tech, and camping gear from verified neighbors near you." />
    <meta name="twitter:image" content="https://www.rentu.site/og-image.png" />

    <!-- Google Schema.org Structured Data (Organization Logo & WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.rentu.site/#website",
          "url": "https://www.rentu.site/",
          "name": "Rentu",
          "alternateName": ["Rentu⁺", "Rentu+", "Rentu.site"],
          "description": "Peer-to-peer rental platform to rent and lend gear locally.",
          "inLanguage": "en-US"
        },
        {
          "@type": "Organization",
          "@id": "https://www.rentu.site/#organization",
          "name": "Rentu",
          "alternateName": "Rentu⁺",
          "url": "https://www.rentu.site/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.rentu.site/icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://www.rentu.site/og-image.png"
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rentu-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-brand/20 selection:text-brand">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
